name: Publish one RC image manifest
description: Merge architecture manifests or reuse a digest, then upload one verified publication receipt.
inputs:
  image-key:
    description: Image key from the release plan
    required: true
  token:
    description: Token with GHCR package write access
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22"
        cache: npm
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: rc-plan
        path: dist/control-release
    - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}
    - name: Publish and verify manifest
      shell: bash
      env:
        IMAGE_KEY: ${{ inputs.image-key }}
      run: node scripts/control-plane-release.mjs publish-image "$GITHUB_REF_NAME" dist/control-release/plan.json "$IMAGE_KEY"
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: rc-image-receipt-${{ inputs.image-key }}
        path: dist/image-receipts/${{ inputs.image-key }}.json
        if-no-files-found: error

name: PR CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  changes:
    name: Detect affected components
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      control: ${{ steps.filter.outputs.control }}
      runner: ${{ steps.filter.outputs.runner }}
      example_mcp: ${{ steps.filter.outputs.example_mcp }}
      litellm: ${{ steps.filter.outputs.litellm }}
      helm: ${{ steps.filter.outputs.helm }}
      core_images: ${{ steps.filter.outputs.core_images }}
      test_modules_any: ${{ steps.modules.outputs.any }}
      test_modules_matrix: ${{ steps.modules.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: filter
        name: Classify changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            contracts:
              - '.github/actions/setup-node-workspace/**'
              - '.github/workflows/pr-ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'packages/contracts/**'
            control:
              - '.github/actions/setup-node-workspace/**'
              - '.github/workflows/pr-ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'packages/contracts/**'
              - 'apps/control/**'
              - 'artifacts/skills/**'
              - 'scripts/package-vendor-skills.py'
            runner:
              - '.github/actions/setup-node-workspace/**'
              - '.github/workflows/pr-ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'packages/contracts/**'
              - 'apps/runner/**'
            example_mcp:
              - '.github/actions/setup-node-workspace/**'
              - '.github/workflows/pr-ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig.base.json'
              - 'apps/example-mcp-server/**'
            litellm:
              - '.dockerignore'
              - '.github/workflows/pr-ci.yml'
              - 'infra/docker/Dockerfile.litellm'
              - 'infra/litellm/**'
            helm:
              - '.github/actions/setup-node-workspace/**'
              - '.github/workflows/pr-ci.yml'
              - 'package.json'
              - 'package-lock.json'
              - 'charts/tali-relay/**'
              - 'scripts/prepare-helm-dependencies.sh'
              - 'scripts/package-control-plane-chart.sh'
              - 'scripts/validate-helm-*.mjs'
              - 'scripts/validate-development-defaults.mjs'
            core_images:
              - '.dockerignore'
              - '.github/workflows/pr-ci.yml'
              - 'infra/docker/Dockerfile'

      - name: Validate test module configuration
        run: npm run test:modules:config

      - id: modules
        name: Select affected test modules
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base_sha="${EVENT_BASE_SHA}"
          if [[ -z "${base_sha}" || "${base_sha}" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          node scripts/testing/select-test-modules.mjs \
            --base "${base_sha}" \
            --head "${EVENT_HEAD_SHA}"

  contracts:
    name: Contracts
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - name: Typecheck contracts
        run: npm run typecheck --workspace @tali/contracts
      - name: Build contracts
        run: npm run build --workspace @tali/contracts

  control:
    name: Control
    needs: changes
    if: needs.changes.outputs.control == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - name: Build shared contracts
        run: npm run build --workspace @tali/contracts
      - name: Verify packaged Skill artifacts
        run: npm run skills:check
      - name: Typecheck control
        run: npm run typecheck --workspace @tali/control
      - name: Build control
        run: npm run build --workspace @tali/control

  runner:
    name: Runner
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - name: Build shared contracts
        run: npm run build --workspace @tali/contracts
      - name: Typecheck runner
        run: npm run typecheck --workspace @tali/runner
      - name: Build runner
        run: npm run build --workspace @tali/runner

  module_tests:
    name: Test / ${{ matrix.label }}
    needs: changes
    if: needs.changes.outputs.test_modules_any == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.test_modules_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - name: Build shared contracts
        run: npm run build --workspace @tali/contracts
      - name: Prepare Hermes proxy test environment
        if: matrix.module == 'runtime-integrations'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/tali-runtime-tests"
          "${RUNNER_TEMP}/tali-runtime-tests/bin/python3" -m pip install \
            --disable-pip-version-check \
            -r runtime-integrations/requirements-test.txt
          echo "${RUNNER_TEMP}/tali-runtime-tests/bin" >> "${GITHUB_PATH}"
      - name: Run affected module
        run: npm run test:module -- ${{ matrix.module }}

  test_matrix:
    name: Test coverage matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - name: Build shared contracts
        run: npm run build --workspace @tali/contracts
      - name: Generate Prisma client used by test discovery
        run: npm run db:generate --workspace @tali/control
      - name: Publish live test inventory to the CI summary
        run: npm run test:matrix:summary

  example_mcp:
    name: Example MCP
    needs: changes
    if: needs.changes.outputs.example_mcp == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - name: Test example MCP server
        run: npm run test --workspace @tali/example-mcp-server
      - name: Typecheck example MCP server
        run: npm run typecheck --workspace @tali/example-mcp-server
      - name: Build example MCP server
        run: npm run build --workspace @tali/example-mcp-server

  litellm:
    name: LiteLLM overlay
    needs: changes
    if: needs.changes.outputs.litellm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and verify LiteLLM overlay
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile.litellm
          target: tasklattice-litellm-builder
          push: false
          cache-from: type=gha,scope=pr-litellm-builder
          cache-to: type=gha,mode=max,scope=pr-litellm-builder

  helm:
    name: Helm
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-node-workspace
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4
      - name: Prepare chart dependencies
        run: npm run helm:dependencies
      - name: Lint chart
        run: helm lint charts/tali-relay
      - name: Validate rendered resources
        run: npm run helm:validate:resources
      - name: Validate embedded Keycloak development integration
        run: npm run helm:validate:dev-defaults
      - name: Validate OpenShift compatibility
        run: npm run helm:validate:openshift
      - name: Validate air-gapped configuration
        run: npm run helm:validate:airgap
      - name: Render default chart
        run: helm template tali-relay charts/tali-relay --namespace tali --kube-version 1.29.0 > /dev/null

  core_images:
    name: Core image (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.core_images == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target:
          - control
          - runner
          - demo-test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: matrix.target == 'control'
        with:
          version: v3.18.4
      - name: Package chart for control image
        if: matrix.target == 'control'
        run: bash scripts/package-control-plane-chart.sh
      - name: Build image target
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/docker/Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=pr-core-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=pr-core-${{ matrix.target }}

  required:
    name: Required
    if: always()
    needs:
      - changes
      - contracts
      - control
      - runner
      - module_tests
      - test_matrix
      - example_mcp
      - litellm
      - helm
      - core_images
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every affected component to pass
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTRACTS_RESULT: ${{ needs.contracts.result }}
          CONTROL_RESULT: ${{ needs.control.result }}
          RUNNER_RESULT: ${{ needs.runner.result }}
          MODULE_TESTS_RESULT: ${{ needs.module_tests.result }}
          TEST_MATRIX_RESULT: ${{ needs.test_matrix.result }}
          EXAMPLE_MCP_RESULT: ${{ needs.example_mcp.result }}
          LITELLM_RESULT: ${{ needs.litellm.result }}
          HELM_RESULT: ${{ needs.helm.result }}
          CORE_IMAGES_RESULT: ${{ needs.core_images.result }}
        run: |
          set -euo pipefail
          failed=0
          for component in \
            CHANGES \
            CONTRACTS \
            CONTROL \
            RUNNER \
            MODULE_TESTS \
            TEST_MATRIX \
            EXAMPLE_MCP \
            LITELLM \
            HELM \
            CORE_IMAGES
          do
            result_variable="${component}_RESULT"
            result="${!result_variable}"
            printf '%-12s %s\n' "${component}" "${result}"
            case "${result}" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          exit "${failed}"

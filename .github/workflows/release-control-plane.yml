name: Release incremental RC

on:
  push:
    tags:
      - "v*.*.*-rc.*"

concurrency:
  group: control-plane-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  HELM_VERSION: "v3.18.4"
  OPENSHELL_VERSION: "0.0.106"
  NEMOCLAW_VERSION: "v0.0.123"
  AGENT_SANDBOX_VERSION: "v1.0.2"
  LITELLM_IMAGE: "litellm/litellm-database:v1.87.0"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  plan:
    name: Plan RC image changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      series: ${{ steps.release.outputs.series }}
      rc: ${{ steps.release.outputs.rc }}
      registry: ${{ steps.release.outputs.registry }}
      coreBuildMatrix: ${{ steps.plan.outputs.coreBuildMatrix }}
      sandboxBuildMatrix: ${{ steps.plan.outputs.sandboxBuildMatrix }}
      coreManifestMatrix: ${{ steps.plan.outputs.coreManifestMatrix }}
      sandboxManifestMatrix: ${{ steps.plan.outputs.sandboxManifestMatrix }}
      coreBuildRequired: ${{ steps.plan.outputs.coreBuildRequired }}
      sandboxBuildRequired: ${{ steps.plan.outputs.sandboxBuildRequired }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - id: release
        name: Parse RC tag
        run: |
          node scripts/control-plane-release.mjs metadata "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject already published RC artifacts
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "This RC is already released. Create a new RC tag instead." >&2
            exit 1
          fi
          for repository in tali-control tali-openshell-runner tali-expert-agent-runtime tali-litellm demo-test tali-nemoclaw-sandbox tali-nemoclaw-hermes-sandbox tali-nemoclaw-deepagents-sandbox charts/tali-relay; do
            reference="$REGISTRY/$repository:$VERSION"
            if docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
              echo "Refusing to overwrite published artifact: $reference" >&2
              exit 1
            fi
          done
      - name: Plan builds against previous successful RC
        id: plan
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/control-plane-release.mjs plan "$GITHUB_REF_NAME" "$REGISTRY" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-plan
          path: dist/control-release/plan.json
          if-no-files-found: error

  validate:
    name: Validate and package RC inputs
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Package shared charts and validate
        env:
          TALI_IMAGE_REGISTRY: ${{ needs.plan.outputs.registry }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          bash scripts/package-control-plane-chart.sh "$VERSION"
          bash scripts/package-worker-charts.sh
          npm run test:modules:config
          node --test scripts/testing/control-plane-release.test.mjs
          npm test
          npm run typecheck
          npm run helm:validate:openshift
          npm run helm:validate:airgap
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-charts
          path: |
            dist/control-plane-chart/tali-relay.tgz
            dist/worker-charts/openshell.tgz
          if-no-files-found: error

  build-core-platforms:
    name: Build Core / ${{ matrix.image }} / ${{ matrix.architecture }}
    needs: [plan, validate]
    if: needs.plan.outputs.coreBuildRequired == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.coreBuildMatrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        if: matrix.key == 'control'
        with:
          name: rc-charts
          path: dist
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.architecture }}
          push: true
          pull: true
          tags: ${{ matrix.reference }}-${{ matrix.architecture }}
          cache-from: |
            type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
            type=gha,scope=${{ matrix.image }}-rc-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-rc-${{ matrix.architecture }}
          build-args: |
            OPENSHELL_VERSION=${{ env.OPENSHELL_VERSION }}
            LITELLM_IMAGE=${{ env.LITELLM_IMAGE }}
          provenance: mode=max
          sbom: true

  build-sandbox-platforms:
    name: Build Sandbox / ${{ matrix.agent }} / ${{ matrix.architecture }}
    needs: [plan, validate]
    if: needs.plan.outputs.sandboxBuildRequired == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.sandboxBuildMatrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Sandbox architecture
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.architecture }}
          NEMOCLAW_AGENT_PLATFORM: ${{ matrix.agent }}
          IMAGE: ${{ matrix.reference }}
          ARCH: ${{ matrix.architecture }}
        run: |
          export NEMOCLAW_IMAGE="$IMAGE-$ARCH"
          export NEMOCLAW_HERMES_IMAGE="$IMAGE-$ARCH"
          export NEMOCLAW_DEEPAGENTS_IMAGE="$IMAGE-$ARCH"
          export NEMOCLAW_BUILD_OUTPUT=ci-push
          export NEMOCLAW_UPSTREAM_IMAGE="${IMAGE%:*}:build-upstream-${IMAGE##*:}-$ARCH"
          export NEMOCLAW_FALLBACK_BASE_IMAGE="${IMAGE%:*}:build-base-${IMAGE##*:}-$ARCH"
          bash scripts/build-nemoclaw-sandbox.sh

  publish-core-manifests:
    name: Manifest Core / ${{ matrix.image }} / ${{ matrix.action }}
    needs: [plan, validate, build-core-platforms]
    # A reuse-only group legitimately skips its architecture builds.
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.validate.result == 'success' &&
          (needs.build-core-platforms.result == 'success' ||
           (needs.build-core-platforms.result == 'skipped' && needs.plan.outputs.coreBuildRequired == 'false')) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.coreManifestMatrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/publish-rc-image
        with:
          image-key: ${{ matrix.key }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-sandbox-manifests:
    name: Manifest Sandbox / ${{ matrix.image }} / ${{ matrix.action }}
    needs: [plan, validate, build-sandbox-platforms]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.validate.result == 'success' &&
          (needs.build-sandbox-platforms.result == 'success' ||
           (needs.build-sandbox-platforms.result == 'skipped' && needs.plan.outputs.sandboxBuildRequired == 'false')) }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.sandboxManifestMatrix) }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/publish-rc-image
        with:
          image-key: ${{ matrix.key }}
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-chart:
    name: Publish Helm chart and assemble release manifest
    needs: [plan, validate, publish-core-manifests, publish-sandbox-manifests]
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success' && needs.validate.result == 'success' &&
          needs.publish-core-manifests.result == 'success' && needs.publish-sandbox-manifests.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      REGISTRY: ${{ needs.plan.outputs.registry }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rc-plan
          path: dist/control-release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rc-charts
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: rc-image-receipt-*
          path: dist/image-receipts
          merge-multiple: true
      - name: Verify all eight image publication receipts
        run: node scripts/control-plane-release.mjs assemble-manifest "$GITHUB_REF_NAME" dist/control-release/plan.json
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Publish Helm chart
        run: |
          asset="dist/control-release/tali-relay-$VERSION.tgz"
          cp dist/control-plane-chart/tali-relay.tgz "$asset"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$asset" "oci://$REGISTRY/charts"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rc-release-assets
          path: |
            dist/control-release/tali-relay-*.tgz
            dist/control-release/release-manifest.json
          if-no-files-found: error

  github-release:
    name: Create GitHub prerelease
    needs: [plan, publish-chart]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.publish-chart.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SERIES: ${{ needs.plan.outputs.series }}
      RC: ${{ needs.plan.outputs.rc }}
      REGISTRY: ${{ needs.plan.outputs.registry }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rc-release-assets
          path: dist/control-release
      - name: Create GitHub prerelease with verified artifacts
        run: |
          {
            echo "# Relay $SERIES RC$RC"
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "All eight first-party images are published as $VERSION (amd64 + arm64)."
            echo "See release-manifest.json for per-image build/reuse decisions, source tags and digests."
            echo "No latest or stable image tags were updated."
            echo
            echo '```bash'
            echo "helm upgrade --install tali-relay oci://$REGISTRY/charts/tali-relay --version $VERSION -n tali --create-namespace -f your-values.yaml"
            echo '```'
            echo
            echo "Remove stale images.*.tag overrides from your values to use this RC."
            echo "Select this prerelease explicitly with --version."
          } > dist/control-release/RELEASE.md
          gh release create "$GITHUB_REF_NAME" "dist/control-release/tali-relay-$VERSION.tgz" dist/control-release/release-manifest.json dist/control-release/RELEASE.md \
            --verify-tag --prerelease --latest=false \
            --title "Relay $SERIES RC$RC" --notes-file dist/control-release/RELEASE.md

name: Release incremental RC

on:
  push:
    tags:
      - "v*.*.*-rc.*"

concurrency:
  group: control-plane-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  HELM_VERSION: "v3.18.4"
  OPENSHELL_VERSION: "0.0.106"
  NEMOCLAW_VERSION: "v0.0.123"
  AGENT_SANDBOX_VERSION: "v1.0.2"
  LITELLM_IMAGE: "litellm/litellm-database:v1.87.0"
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.release.outputs.version }}
      series: ${{ steps.release.outputs.series }}
      matrix: ${{ steps.plan.outputs.matrix }}
      rc: ${{ steps.release.outputs.rc }}
      registry: ${{ steps.release.outputs.registry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - id: release
        name: Parse RC tag
        shell: bash
        run: |
          set -euo pipefail
          node scripts/control-plane-release.mjs metadata "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Reject already published RC artifacts
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "This RC is already released. Create a new RC tag instead." >&2
            exit 1
          fi
          for repository in tali-control tali-openshell-runner tali-expert-agent-runtime tali-litellm demo-test tali-nemoclaw-sandbox tali-nemoclaw-hermes-sandbox tali-nemoclaw-deepagents-sandbox charts/tali-relay; do
            reference="$REGISTRY/$repository:$VERSION"
            if docker buildx imagetools inspect "$reference" >/dev/null 2>&1; then
              echo "Refusing to overwrite published artifact: $reference" >&2
              exit 1
            fi
          done
      - name: Plan builds against the previous successful RC
        id: plan
        env:
          REGISTRY: ${{ steps.release.outputs.registry }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/control-plane-release.mjs plan "$GITHUB_REF_NAME" "$REGISTRY" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Validate and package once for both architectures
        env:
          TALI_IMAGE_REGISTRY: ${{ steps.release.outputs.registry }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          bash scripts/package-control-plane-chart.sh "$VERSION"
          bash scripts/package-worker-charts.sh
          npm run test:modules:config
          node --test scripts/testing/control-plane-release.test.mjs
          npm test
          npm run typecheck
          npm run helm:validate:openshift
          npm run helm:validate:airgap
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: control-release-inputs
          path: |
            dist/control-plane-chart/tali-relay.tgz
            dist/worker-charts/openshell.tgz
            dist/control-release/
          if-no-files-found: error

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: control-release-inputs
          path: dist
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        if: matrix.agent == ''
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.architecture }}
          push: true
          pull: true
          tags: ${{ needs.prepare.outputs.registry }}/${{ matrix.image }}:${{ needs.prepare.outputs.version }}-${{ matrix.architecture }}
          cache-from: |
            type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
            type=gha,scope=${{ matrix.image }}-rc-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-rc-${{ matrix.architecture }}
          build-args: |
            OPENSHELL_VERSION=${{ env.OPENSHELL_VERSION }}
            LITELLM_IMAGE=${{ env.LITELLM_IMAGE }}
          provenance: mode=max
          sbom: true
      - name: Build Sandbox architecture
        if: matrix.agent != ''
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.architecture }}
          NEMOCLAW_AGENT_PLATFORM: ${{ matrix.agent }}
          IMAGE: ${{ matrix.reference }}
          ARCH: ${{ matrix.architecture }}
        run: |
          export NEMOCLAW_IMAGE="$IMAGE-$ARCH"
          export NEMOCLAW_HERMES_IMAGE="$IMAGE-$ARCH"
          export NEMOCLAW_DEEPAGENTS_IMAGE="$IMAGE-$ARCH"
          export NEMOCLAW_BUILD_OUTPUT=ci-push
          export NEMOCLAW_UPSTREAM_IMAGE="${IMAGE%:*}:build-upstream-${IMAGE##*:}-$ARCH"
          export NEMOCLAW_FALLBACK_BASE_IMAGE="${IMAGE%:*}:build-base-${IMAGE##*:}-$ARCH"
          bash scripts/build-nemoclaw-sandbox.sh

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      SERIES: ${{ needs.prepare.outputs.series }}
      RC: ${{ needs.prepare.outputs.rc }}
      REGISTRY: ${{ needs.prepare.outputs.registry }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: control-release-inputs
          path: dist
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Publish RC manifests, Helm chart and prerelease
        shell: bash
        run: |
          set -euo pipefail
          node scripts/control-plane-release.mjs publish-images "$GITHUB_REF_NAME" dist/control-release/plan.json
          asset="dist/control-release/tali-relay-$VERSION.tgz"
          cp dist/control-plane-chart/tali-relay.tgz "$asset"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$asset" "oci://$REGISTRY/charts"
          {
            echo "# Relay $SERIES RC$RC"
            echo
            echo "Source commit: $GITHUB_SHA"
            echo "All eight first-party images are published as $VERSION (amd64 + arm64)."
            echo "See release-manifest.json for per-image build/reuse decisions, source tags and digests."
            echo "No latest or stable image tags were updated."
            echo
            echo '```bash'
            echo "helm upgrade --install tali-relay oci://$REGISTRY/charts/tali-relay --version $VERSION -n tali --create-namespace -f your-values.yaml"
            echo '```'
            echo
            echo "Remove stale images.*.tag overrides from your values to use this RC."
            echo "Select this prerelease explicitly with --version."
          } > dist/control-release/RELEASE.md
          gh release create "$GITHUB_REF_NAME" "$asset" dist/control-release/release-manifest.json dist/control-release/RELEASE.md \
            --verify-tag --prerelease --latest=false \
            --title "Relay $SERIES RC$RC" --notes-file dist/control-release/RELEASE.md

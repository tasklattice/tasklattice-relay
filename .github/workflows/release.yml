name: Release images and Helm chart

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Upstream dependencies are selected by human-readable release tags. Rebuilding
# a release resolves those tags again and replaces the TaskLattice artifacts.
env:
  DOCKER_BUILD_RECORD_UPLOAD: "false"
  DOCKER_BUILD_SUMMARY: "false"
  NODE_VERSION: "22"
  HELM_VERSION: "v3.18.4"
  OPENSHELL_VERSION: "0.0.106"
  NEMOCLAW_VERSION: "v0.0.114"
  AGENT_SANDBOX_VERSION: "v0.5.1"
  AGENT_SANDBOX_CHART_VERSION: "0.1.0"
  LITELLM_IMAGE: "litellm/litellm-database:v1.87.0"

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 2
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - run: npm run helm:dependencies
      - run: helm lint charts/tali-relay
      - run: npm run helm:validate:resources
      - run: npm run helm:validate:dev-defaults
      - run: npm run helm:validate:openshift
      - run: npm run helm:validate:airgap
      - run: helm template tali-relay charts/tali-relay --namespace tali --kube-version 1.29.0 > /dev/null
      - name: Render embedded Keycloak test mode
        run: >-
          helm template tali-relay charts/tali-relay
          --namespace tali
          --kube-version 1.29.0
          --set control.publicUrl=http://192.0.2.10
          --set keycloak.enabled=true
          --set keycloak.publicUrl=http://192.0.2.11:8080
          > /dev/null

  publish-core-platforms:
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: tali-control
            dockerfile: infra/docker/Dockerfile
            target: control
            architecture: amd64
            runner: ubuntu-24.04
          - image: tali-control
            dockerfile: infra/docker/Dockerfile
            target: control
            architecture: arm64
            runner: ubuntu-24.04-arm
          - image: tali-openshell-runner
            dockerfile: infra/docker/Dockerfile
            target: runner
            architecture: amd64
            runner: ubuntu-24.04
          - image: tali-openshell-runner
            dockerfile: infra/docker/Dockerfile
            target: runner
            architecture: arm64
            runner: ubuntu-24.04-arm
          - image: tali-litellm
            dockerfile: infra/docker/Dockerfile.litellm
            target: ""
            architecture: amd64
            runner: ubuntu-24.04
          - image: tali-litellm
            dockerfile: infra/docker/Dockerfile.litellm
            target: ""
            architecture: arm64
            runner: ubuntu-24.04-arm
          - image: demo-test
            dockerfile: infra/docker/Dockerfile
            target: demo-test
            architecture: amd64
            runner: ubuntu-24.04
          - image: demo-test
            dockerfile: infra/docker/Dockerfile
            target: demo-test
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        if: matrix.image == 'tali-control'
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Package Helm chart for Control Plane image
        if: matrix.image == 'tali-control'
        shell: bash
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          TALI_IMAGE_REGISTRY="${registry}" \
            bash scripts/package-control-plane-chart.sh "${GITHUB_REF_NAME#v}"
      - id: image
        name: Resolve image tags
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image="${registry}/${{ matrix.image }}"
          {
            echo "name=${image}"
            echo "version=${version}"
            echo "tags<<EOF"
            echo "${image}:${version}-${{ matrix.architecture }}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.architecture }}
          pull: true
          no-cache-filters: openshell-cli
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.architecture }}
          build-args: |
            OPENSHELL_VERSION=${{ env.OPENSHELL_VERSION }}
            LITELLM_IMAGE=${{ env.LITELLM_IMAGE }}
          provenance: mode=max
          sbom: true

  publish-core-manifests:
    needs: publish-core-platforms
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - tali-control
          - tali-openshell-runner
          - tali-litellm
          - demo-test
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          sources=("${image}:${version}-amd64" "${image}:${version}-arm64")
          docker buildx imagetools create --tag "${image}:${version}" "${sources[@]}"
          if [[ "${version}" != *-* ]]; then
            docker buildx imagetools create --tag "${image}:latest" "${sources[@]}"
          fi

  publish-sandbox-platforms:
    needs: validate
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - agent: openclaw
            architecture: amd64
            runner: ubuntu-24.04
          - agent: openclaw
            architecture: arm64
            runner: ubuntu-24.04-arm
          - agent: hermes
            architecture: amd64
            runner: ubuntu-24.04
          - agent: hermes
            architecture: arm64
            runner: ubuntu-24.04-arm
          - agent: deepagents
            architecture: amd64
            runner: ubuntu-24.04
          - agent: deepagents
            architecture: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture image
        shell: bash
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.architecture }}
          NEMOCLAW_AGENT_PLATFORM: ${{ matrix.agent }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          if [[ "${NEMOCLAW_AGENT_PLATFORM}" == "openclaw" ]]; then
            image="${registry}/tali-nemoclaw-sandbox"
            export NEMOCLAW_IMAGE="${image}:${version}-${{ matrix.architecture }}"
          elif [[ "${NEMOCLAW_AGENT_PLATFORM}" == "hermes" ]]; then
            image="${registry}/tali-nemoclaw-hermes-sandbox"
            export NEMOCLAW_HERMES_IMAGE="${image}:${version}-${{ matrix.architecture }}"
          else
            image="${registry}/tali-nemoclaw-deepagents-sandbox"
            export NEMOCLAW_DEEPAGENTS_IMAGE="${image}:${version}-${{ matrix.architecture }}"
          fi
          export NEMOCLAW_BUILD_OUTPUT=ci-push
          export NEMOCLAW_UPSTREAM_IMAGE="${image}:build-upstream-${version}-${{ matrix.architecture }}"
          export NEMOCLAW_FALLBACK_BASE_IMAGE="${image}:build-base-${version}-${{ matrix.architecture }}"
          bash scripts/build-nemoclaw-sandbox.sh

  publish-sandbox-manifests:
    needs: publish-sandbox-platforms
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - tali-nemoclaw-sandbox
          - tali-nemoclaw-hermes-sandbox
          - tali-nemoclaw-deepagents-sandbox
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifest
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}"
          sources=("${image}:${version}-amd64" "${image}:${version}-arm64")
          docker buildx imagetools create --tag "${image}:${version}" "${sources[@]}"
          if [[ "${version}" != *-* ]]; then
            docker buildx imagetools create --tag "${image}:latest" "${sources[@]}"
          fi

  release:
    needs: [publish-core-manifests, publish-sandbox-manifests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package and publish Helm chart
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p dist
          TALI_IMAGE_REGISTRY="${registry}" \
            bash scripts/package-control-plane-chart.sh "${version}"
          cp dist/control-plane-chart/tali-relay.tgz "dist/tali-relay-${version}.tgz"
          helm push "dist/tali-relay-${version}.tgz" "oci://${registry}/charts"
      - name: Create image transfer list
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          image_list="dist/tasklattice-images-${version}.txt"
          images=(
            tali-control
            tali-openshell-runner
            tali-litellm
            demo-test
            tali-nemoclaw-sandbox
            tali-nemoclaw-hermes-sandbox
            tali-nemoclaw-deepagents-sandbox
          )
          : > "${image_list}"
          for image in "${images[@]}"; do
            echo "${registry}/${image}:${version}" >> "${image_list}"
          done
          {
            echo "## Image transfer list"
            echo
            echo '```text'
            cat "${image_list}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Upload image transfer list
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tasklattice-image-list-${{ github.ref_name }}
          path: dist/tasklattice-images-*.txt
          if-no-files-found: error
          retention-days: 90
      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="dist/tali-relay-${version}.tgz"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${asset}" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${asset}" \
              --verify-tag \
              --generate-notes \
              --title "TaskLattice Relay ${version}"
          fi

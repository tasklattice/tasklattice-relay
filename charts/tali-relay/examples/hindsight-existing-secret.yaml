# Hindsight's external Secret contains only the complete hindsight-config.json.
# Export an initialized configuration into a private local file and review it:
# umask 077
# kubectl -n tali get secret tali-relay-hindsight-config -o jsonpath='{.data.hindsight-config\.json}' | base64 --decode > /tmp/hindsight-config.json
# kubectl create secret generic my-hindsight-config --from-file=hindsight-config.json=/tmp/hindsight-config.json --dry-run=client -o yaml
# Then set secrets.existingSecrets.hindsight=my-hindsight-config.
# Keep Control memory credentials/router token and database bootstrap credentials
# consistent with this file. Never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: my-hindsight-config
type: Opaque
stringData:
  hindsight-config.json: REPLACE_WITH_COMPLETE_REVIEWED_CONFIGURATION

# Built-in identities for the optional, ephemeral Keycloak test provider.
# Not production accounts. Credentials are supplied by the credential bootstrap.
# Stable user IDs preserve OIDC subject mappings across Pod recreation.
# Realm groups for the two default development Projects. The post-deploy
# configurator binds every Project it discovers, so additional development
# Projects do not require script changes.
testProjectIds:
  - proj1
  - isolation-1
testUsers:
  # Stable IDs keep OIDC subject mappings valid when the ephemeral test
  # Keycloak Pod is recreated and imports the realm again.
  - id: 247cf669-9e00-4948-bc83-39d4fd3626fc
    username: alice
    email: alice@tali.test
    firstName: Alice
    lastName: Operator
    groups:
      - /tali/d/dep1/p/proj1/r/ROLE_PROJECT_ADMIN
      - /tali/d/dep1/p/isolation-1/r/ROLE_PROJECT_ADMIN
  - id: 71000000-0000-4000-8000-000000000001

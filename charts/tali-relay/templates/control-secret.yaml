{{- if not .Values.secrets.existingSecrets.control }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali.secretName" (dict "root" . "component" "control") }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" "control") | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
type: Opaque
stringData:
  control.toml: |
{{ include "tali.controlConfig" . | indent 4 }}
{{- end }}

{{- if .Values.control.worker.enabled }}
{{- $component := "control-worker" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: metrics
      port: 9090
      targetPort: health
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "application") | nindent 4 }}
spec:
  replicas: {{ .Values.control.worker.replicaCount }}
  selector:
    matchLabels:
      {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/control-config: {{ include "tali.controlConfigChecksum" . }}
        {{- if .Values.hindsight.enabled }}
        checksum/hindsight-secret: {{ include "tali.hindsightSecretChecksum" . }}
        {{- end }}
        {{- with .Values.global.rolloutRevision }}
        tali.ai/rollout-revision: {{ . | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 600
      serviceAccountName: {{ include "tali.controlWorkerServiceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate-control-database
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.control) }}
          imagePullPolicy: {{ .Values.images.control.pullPolicy }}
          workingDir: /app/apps/control
          command:
            - /app/node_modules/.bin/prisma
            - migrate
            - deploy
            - --config
            - prisma.config.ts
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: TALI_CONFIG
              value: /etc/tali/control.toml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.control.initResources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: control-config
              mountPath: /etc/tali
              readOnly: true
      containers:
        - name: control-worker
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.control) }}
          imagePullPolicy: {{ .Values.images.control.pullPolicy }}
          command:
            - node
            - apps/control/.output/workers/control-worker.mjs
          env:
            - name: TALI_CONFIG
              value: /etc/tali/control.toml
            - name: CONTROL_WORKER_HEALTH_PORT
              value: "9090"
            - name: TALI_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: metrics-token
            {{- if .Values.hindsight.enabled }}
            - name: TALI_HINDSIGHT_URL
              value: {{ include "tali.hindsightUrl" . | quote }}
            - name: TALI_HINDSIGHT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: hindsight-api-key
            {{- end }}
            {{- if .Values.docling.enabled }}
            - name: DOCLING_BASE_URL
              value: {{ printf "http://%s:%v" (include "tali.componentName" (dict "root" . "component" "docling")) .Values.docling.service.port | quote }}
            {{- end }}
            {{- include "tali.projectOpenShellReconcilerEnv" . | nindent 12 }}
            {{- with .Values.control.worker.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: health
              containerPort: 9090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.control.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: control-config
              mountPath: /etc/tali
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: control-config
          secret:
            secretName: {{ include "tali.secretName" . }}
            items:
              - key: control.toml
                path: control.toml
{{- end }}

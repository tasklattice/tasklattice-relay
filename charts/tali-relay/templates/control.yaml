{{- $root := . -}}
{{- $component := "control" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "application") | nindent 4 }}
spec:
  replicas: {{ .Values.control.replicaCount }}
  selector:
    matchLabels:
      {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/control-config: {{ include "tali.controlConfigChecksum" . }}
        {{- if .Values.hindsight.enabled }}
        checksum/hindsight-secret: {{ include "tali.hindsightSecretChecksum" . }}
        {{- end }}
        {{- with .Values.global.rolloutRevision }}
        tali.ai/rollout-revision: {{ . | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tali.serviceAccountName" . }}
      automountServiceAccountToken: true
      {{- with .Values.control.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate-control-database
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.control) }}
          imagePullPolicy: {{ .Values.images.control.pullPolicy }}
          workingDir: /app/apps/control
          command:
            - /app/node_modules/.bin/prisma
            - migrate
            - deploy
            - --config
            - prisma.config.ts
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: TALI_CONFIG
              value: /etc/tali/control.toml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.control.initResources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: control-config
              mountPath: /etc/tali
              readOnly: true
        - name: seed-built-in-skills
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.control) }}
          imagePullPolicy: {{ .Values.images.control.pullPolicy }}
          workingDir: /app/apps/control
          command:
            - node
            - prisma/seed-built-in-skills.mjs
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: TALI_CONFIG
              value: /etc/tali/control.toml
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.control.initResources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: control-config
              mountPath: /etc/tali
              readOnly: true
      containers:
        - name: control
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.control) }}
          imagePullPolicy: {{ .Values.images.control.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: TALI_CONFIG
              value: /etc/tali/control.toml
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: TALI_BOOTSTRAP_INTERNAL_URL
              value: {{ printf "http://%s.%s.svc.cluster.local:%v" $name .Release.Namespace .Values.control.service.port | quote }}
            - name: TALI_DEMO_TEST_IMAGE
              value: {{ include "tali.image" (dict "root" . "image" .Values.images.exampleMcp) | quote }}
            - name: TALI_BOOTSTRAP_RUNNER_URL
              value: {{ printf "http://%s:9090" (include "tali.componentName" (dict "root" . "component" "runner")) | quote }}
            - name: TALI_BOOTSTRAP_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: runner-token
            - name: TALI_BOOTSTRAP_LITELLM_URL
              value: {{ printf "http://%s.%s.svc.cluster.local:4000" (include "tali.componentName" (dict "root" . "component" "litellm")) .Release.Namespace | quote }}
            - name: TALI_BOOTSTRAP_LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: litellm-master-key
            {{- if .Values.hindsight.enabled }}
            - name: TALI_HINDSIGHT_URL
              value: {{ include "tali.hindsightUrl" . | quote }}
            - name: MEMORY_RUNTIME_RECALL_TIMEOUT_MS
              value: {{ .Values.hindsight.runtimeRecallTimeoutMs | quote }}
            - name: TALI_HINDSIGHT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: hindsight-api-key
            {{- end }}
            - name: TALI_BOOTSTRAP_RUNTIME_NAMESPACES_ENABLED
              value: {{ .Values.projectRuntimeNamespaces.enabled | quote }}
            - name: TALI_BOOTSTRAP_RUNTIME_CLUSTER_ID
              value: {{ .Values.projectRuntimeNamespaces.clusterId | quote }}
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            {{- include "tali.projectOpenShellReconcilerEnv" . | nindent 12 }}
            {{- with .Values.control.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.control.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: control-config
              mountPath: /etc/tali
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: control-config
          secret:
            secretName: {{ include "tali.secretName" . }}
            items:
              - key: control.toml
                path: control.toml
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.labels" . | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation" "annotations" .Values.control.service.annotations) | nindent 4 }}
spec:
  type: {{ .Values.control.service.type }}
  selector:
    {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.control.service.port }}
      targetPort: http

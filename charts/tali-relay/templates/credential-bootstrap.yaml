{{- $spec := include "tali.bootstrapSpec" . | fromJson -}}
{{- if gt (len $spec.outputs) 0 -}}
{{- $names := list $spec.credentialSecret -}}
{{- range $spec.outputs -}}
{{- if eq .name $spec.credentialSecret -}}
{{- fail "credentialBootstrap.existingSecret must not name a generated component Secret" -}}
{{- end -}}
{{- if has .name $names -}}
{{- fail "Credential store and output Secret names must be distinct; shorten fullnameOverride or release name" -}}
{{- end -}}
{{- $names = append $names .name -}}
{{- end -}}
{{- $name := include "tali.componentName" (dict "root" . "component" "credential-bootstrap") -}}
{{- $sa := default $name .Values.credentialBootstrap.serviceAccountName -}}
{{- $clusterName := printf "%s-%s" ($name | trunc 48 | trimSuffix "-") (printf "%s/%s" .Release.Namespace .Release.Name | sha256sum | trunc 12) -}}
{{- $image := include "tali.image" (dict "root" . "image" .Values.images.control) -}}
{{- $host := first (splitList "/" $image) -}}
{{- $internal := or (regexMatch "^image-registry\\.openshift-image-registry\\.svc(\\.cluster\\.local)?:5000$" $host) (and .Values.openshift.imageRegistryHost (eq .Values.openshift.imageRegistryHost $host)) -}}
{{- $ocpInternal := and .Values.openshift.enabled $internal -}}
{{- $autoPull := and $ocpInternal (not .Values.global.imagePullSecrets) (not .Values.credentialBootstrap.serviceAccountName) -}}
{{- $pullSecret := "" -}}
{{- $existingSA := dict -}}
{{- $sourceNamespace := "" -}}
{{- if $ocpInternal -}}
{{- $parts := splitList "/" $image -}}
{{- if ne (len $parts) 3 -}}
{{- fail "OCP bootstrap image must have the form registry/namespace/imagestream:tag (or @digest)" -}}
{{- end -}}
{{- $sourceNamespace = index $parts 1 -}}
{{- if or (gt (len $sourceNamespace) 63) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$" $sourceNamespace)) -}}
{{- fail "OCP bootstrap image source namespace must be a DNS label of at most 63 characters" -}}
{{- end -}}
{{- end -}}
{{- if $autoPull -}}
{{/* Use a new, stable identity rather than adopting the legacy, recreated hook SA. */}}
{{- $sa = printf "%s-ocp-%s" ($name | trunc 40 | trimSuffix "-") (printf "%s/%s" .Release.Namespace .Release.Name | sha256sum | trunc 12) -}}
{{- $pullSecret = printf "%s-pull" $sa -}}
{{- $existingSA = lookup "v1" "ServiceAccount" .Release.Namespace $sa | default dict -}}
{{- if $existingSA -}}
{{- if or $existingSA.metadata.deletionTimestamp (ne (dig "metadata" "annotations" "openshift.io/internal-registry-pull-secret-ref" "" $existingSA) $pullSecret) (ne (dig "metadata" "annotations" "meta.helm.sh/release-name" "" $existingSA) .Release.Name) (ne (dig "metadata" "annotations" "meta.helm.sh/release-namespace" "" $existingSA) .Release.Namespace) -}}
{{- fail "OCP bootstrap ServiceAccount is terminating or has unexpected ownership/pull-secret annotation; refusing to replace it" -}}
{{- end -}}
{{- end -}}
{{- end }}
{{- if and (not .Values.credentialBootstrap.serviceAccountName) (not $existingSA) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  namespace: {{ .Release.Namespace }}
  annotations:
    {{- if $autoPull }}
    # Rollback uses cached hooks, without lookup: never recreate this SA on rollback.
    helm.sh/hook: pre-install,pre-upgrade
    # A stale/offline render must fail on AlreadyExists rather than invalidate tokens.
    helm.sh/hook-delete-policy: hook-failed
    helm.sh/resource-policy: keep
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    openshift.io/internal-registry-pull-secret-ref: {{ $pullSecret | quote }}
    {{- else }}
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-delete-policy: before-hook-creation
    {{- end }}
    helm.sh/hook-weight: "-40"
automountServiceAccountToken: false
---
{{- end }}
{{- if $ocpInternal }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $clusterName }}-pull
  namespace: {{ $sourceNamespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames:
      - {{ $spec.credentialSecret | quote }}
      {{- range $spec.outputs }}
      - {{ .name | quote }}
      {{- end }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [patch]
    resourceNames:
      {{- range $spec.outputs }}
      - {{ .name | quote }}
      {{- end }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
    resourceNames: [{{ .Release.Namespace | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  spec.json: |
    {{- $spec | toPrettyJson | nindent 4 }}
  bootstrap-secrets.mjs: |
    {{- .Files.Get "files/bootstrap-secrets.mjs" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" "credential-bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.credentialBootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" "credential-bootstrap") | nindent 8 }}
    spec:
      serviceAccountName: {{ $sa }}
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- if $autoPull }}
      # OCP creates/rotates this Secret asynchronously. Explicitly reference it so
      # kubelet retries can use it even if Pod admission precedes Secret creation.
      imagePullSecrets:
        - name: {{ $pullSecret }}
      {{- else if .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.images.control.pullPolicy }}
          command: [node, /app/scripts/credential-bootstrap/bootstrap-secrets.mjs]
          args: [/app/scripts/credential-bootstrap/spec.json]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.credentialBootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /app/scripts/credential-bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: {{ $name }}
{{- end }}

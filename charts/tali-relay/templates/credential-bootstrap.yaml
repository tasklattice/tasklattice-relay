{{- $spec := include "tali.bootstrapSpec" . | fromJson -}}
{{- if gt (len $spec.outputs) 0 -}}
{{- $names := list $spec.credentialSecret -}}
{{- range $spec.outputs -}}
{{- if eq .name $spec.credentialSecret -}}
{{- fail "credentialBootstrap.existingSecret must not name a generated component Secret" -}}
{{- end -}}
{{- if has .name $names -}}
{{- fail "Credential store and output Secret names must be distinct; shorten fullnameOverride or release name" -}}
{{- end -}}
{{- $names = append $names .name -}}
{{- end -}}
{{- $name := include "tali.componentName" (dict "root" . "component" "credential-bootstrap") -}}
{{- $sa := default $name .Values.credentialBootstrap.serviceAccountName -}}
{{- $clusterName := printf "%s-%s" ($name | trunc 48 | trimSuffix "-") (printf "%s/%s" .Release.Namespace .Release.Name | sha256sum | trunc 12) -}}
{{- $image := include "tali.image" (dict "root" . "image" .Values.images.control) -}}
{{- $host := first (splitList "/" $image) -}}
{{- $internal := or (regexMatch "^image-registry\\.openshift-image-registry\\.svc(\\.cluster\\.local)?:5000$" $host) (and .Values.openshift.imageRegistryHost (eq .Values.openshift.imageRegistryHost $host)) -}}
{{- if and .Values.openshift.enabled $internal (not .Values.global.imagePullSecrets) (not .Values.credentialBootstrap.serviceAccountName) -}}
{{- fail "Internal OCP bootstrap images require credentialBootstrap.serviceAccountName with ready pull credentials, or pre-provisioned global.imagePullSecrets" -}}
{{- end }}
{{- if not .Values.credentialBootstrap.serviceAccountName }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $sa }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
automountServiceAccountToken: false
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
    resourceNames:
      - {{ $spec.credentialSecret | quote }}
      {{- range $spec.outputs }}
      - {{ .name | quote }}
      {{- end }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [patch]
    resourceNames:
      {{- range $spec.outputs }}
      - {{ .name | quote }}
      {{- end }}
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
    resourceNames: [{{ .Release.Namespace | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  spec.json: |
    {{- $spec | toPrettyJson | nindent 4 }}
  bootstrap-secrets.mjs: |
    {{- .Files.Get "files/bootstrap-secrets.mjs" | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" "credential-bootstrap") | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade,pre-rollback
    helm.sh/hook-weight: "-20"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.credentialBootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" "credential-bootstrap") | nindent 8 }}
    spec:
      serviceAccountName: {{ $sa }}
      automountServiceAccountToken: true
      restartPolicy: Never
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.images.control.pullPolicy }}
          command: [node, /app/scripts/credential-bootstrap/bootstrap-secrets.mjs]
          args: [/app/scripts/credential-bootstrap/spec.json]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.credentialBootstrap.resources | nindent 12 }}
          volumeMounts:
            - name: bootstrap
              mountPath: /app/scripts/credential-bootstrap
              readOnly: true
      volumes:
        - name: bootstrap
          configMap:
            name: {{ $name }}
{{- end }}

{{- if .Values.docling.enabled }}
{{- if and .Values.docling.persistence.enabled (gt (int .Values.docling.replicaCount) 1) (not (has "ReadWriteMany" .Values.docling.persistence.accessModes)) }}
{{- fail "docling replicas > 1 require ReadWriteMany storage or persistence.enabled=false" }}
{{- end }}
{{- $component := "docling" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
{{- if and .Values.docling.persistence.enabled (not .Values.docling.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-models
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
spec:
  accessModes: {{ .Values.docling.persistence.accessModes | toJson }}
  {{- with .Values.docling.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.docling.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "platform") | nindent 4 }}
spec:
  replicas: {{ .Values.docling.replicaCount }}
  {{- if .Values.docling.persistence.enabled }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/docling-config: {{ include "tali.doclingConfig" . | sha256sum }}
    spec:
      serviceAccountName: {{ include "tali.runtimeServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        runAsUser: 1001
        runAsGroup: 1001
        {{- end }}
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-models
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.docling) }}
          imagePullPolicy: {{ .Values.images.docling.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - |
              marker=/var/lib/docling/models/.seed-{{ include "tali.image" (dict "root" . "image" .Values.images.docling) | sha256sum }}
              if [ ! -f "$marker" ]; then
                mkdir -p /var/lib/docling/models/artifacts
                cp -R /opt/app-root/src/.cache/docling/models/. /var/lib/docling/models/artifacts/
                touch "$marker"
              fi
          volumeMounts:
            - name: models
              mountPath: /var/lib/docling/models
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: docling
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.docling) }}
          imagePullPolicy: {{ .Values.images.docling.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - unset DOCLING_SERVE_ARTIFACTS_PATH; exec docling-serve run --no-enable-ui
          ports:
            - name: http
              containerPort: 5001
          env:
            - name: UVICORN_HOST
              value: "0.0.0.0"
            - name: UVICORN_PORT
              value: "5001"
            - name: UVICORN_WORKERS
              value: "1"
            - name: DOCLING_DEVICE
              value: {{ .Values.docling.device | quote }}
            - name: DOCLING_NUM_THREADS
              value: {{ .Values.docling.threads | quote }}
            - name: DOCLING_SERVE_CONFIG_FILE
              value: /etc/docling/config.yaml
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /var/lib/docling/models/cache
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.docling.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: docling-config
              mountPath: /etc/docling
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /var/lib/docling/models
      volumes:
        - name: docling-config
          configMap:
            name: {{ $name }}-config
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: models
          {{- if .Values.docling.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-models" $name) .Values.docling.persistence.existingClaim }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.docling.persistence.size }}
          {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.docling.service.port }}
      targetPort: http
{{- end }}

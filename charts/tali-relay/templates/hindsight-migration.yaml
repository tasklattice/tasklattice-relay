{{- if .Values.hindsight.enabled }}
{{- $component := "hindsight-migration" -}}
{{- $databaseName := include "tali.hindsightDatabaseName" . -}}
{{- $databaseUser := include "tali.hindsightDatabaseUser" . -}}
{{- $databaseSchema := include "tali.hindsightDatabaseSchema" . -}}
{{- $migrationRevision := printf "%s:%s:%s:%s:%s:%v" .Values.images.hindsight.repository .Values.images.hindsight.tag $databaseName $databaseUser $databaseSchema (include "tali.hindsightSecretChecksum" .) | sha256sum | trunc 10 -}}
{{- $name := printf "%s-%s" (include "tali.componentName" (dict "root" . "component" $component)) $migrationRevision | trunc 63 | trimSuffix "-" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "database") | nindent 4 }}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: {{ .Values.hindsight.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.hindsight.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "tali.componentName" (dict "root" . "component" "hindsight") }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-hindsight-database
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.hindsight) }}
          imagePullPolicy: {{ .Values.images.hindsight.pullPolicy }}
          command: ["python", "/etc/hindsight-launcher/bootstrap.py"]
          env:
            - name: HOME
              value: /tmp
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            {{- toYaml .Values.hindsight.migration.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: hindsight-config
              mountPath: /etc/hindsight
              readOnly: true
            - name: hindsight-launcher
              mountPath: /etc/hindsight-launcher
              readOnly: true
            - name: postgres-bootstrap
              mountPath: /etc/postgresql
              readOnly: true
      containers:
        - name: migrate
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.hindsight) }}
          imagePullPolicy: {{ .Values.images.hindsight.pullPolicy }}
          command: ["python", "/etc/hindsight-launcher/entrypoint.py", "migration"]
          resources:
            {{- toYaml .Values.hindsight.migration.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: hindsight-config
              mountPath: /etc/hindsight
              readOnly: true
            - name: hindsight-launcher
              mountPath: /etc/hindsight-launcher
              readOnly: true
      volumes:
        - name: postgres-bootstrap
          secret:
            secretName: {{ include "tali.secretName" (dict "root" . "component" "postgresql") }}
            items:
              - key: admin-url
                path: admin-url
        - name: hindsight-config
          secret:
            secretName: {{ include "tali.secretName" (dict "root" . "component" "hindsight") }}
            items:
              - key: hindsight-config.json
                path: config.json
        - name: hindsight-launcher
          configMap:
            name: {{ include "tali.componentName" (dict "root" . "component" "hindsight-launcher") }}
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
{{- end }}

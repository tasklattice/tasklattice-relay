{{- if .Values.hindsight.enabled }}
{{- $component := "hindsight-migration" -}}
{{- $databaseName := include "tali.hindsightDatabaseName" . -}}
{{- $databaseUser := include "tali.hindsightDatabaseUser" . -}}
{{- $databaseSchema := include "tali.hindsightDatabaseSchema" . -}}
{{- $migrationRevision := printf "%s:%s:%s:%s:%s:%v" .Values.images.hindsight.repository .Values.images.hindsight.tag $databaseName $databaseUser $databaseSchema .Values.hindsight.models.embeddingDimensions | sha256sum | trunc 10 -}}
{{- $name := printf "%s-%s" (include "tali.componentName" (dict "root" . "component" $component)) $migrationRevision | trunc 63 | trimSuffix "-" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "database") | nindent 4 }}
spec:
  backoffLimit: 6
  activeDeadlineSeconds: {{ .Values.hindsight.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "tali.componentName" (dict "root" . "component" "hindsight") }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- if not .Values.openshift.enabled }}
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap-hindsight-database
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.postgres) }}
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready --host="$PGHOST" --username="$PGUSER" --dbname=postgres; do
                sleep 2
              done
              psql --dbname=postgres --set=ON_ERROR_STOP=1 --set=memory_password="$HINDSIGHT_DATABASE_PASSWORD" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', '{{ $databaseUser }}', :'memory_password')
                WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '{{ $databaseUser }}') \gexec
              SELECT format('ALTER ROLE %I PASSWORD %L', '{{ $databaseUser }}', :'memory_password') \gexec
              SELECT format('CREATE DATABASE %I OWNER %I', '{{ $databaseName }}', '{{ $databaseUser }}')
                WHERE NOT EXISTS (SELECT 1 FROM pg_database WHERE datname = '{{ $databaseName }}') \gexec
              SQL
              psql --dbname={{ $databaseName }} --set=ON_ERROR_STOP=1 <<'SQL'
              ALTER DATABASE {{ $databaseName }} OWNER TO {{ $databaseUser }};
              CREATE EXTENSION IF NOT EXISTS vector WITH SCHEMA public;
              CREATE EXTENSION IF NOT EXISTS pg_trgm WITH SCHEMA public;
              CREATE SCHEMA IF NOT EXISTS {{ $databaseSchema }} AUTHORIZATION {{ $databaseUser }};
              ALTER SCHEMA {{ $databaseSchema }} OWNER TO {{ $databaseUser }};
              GRANT USAGE ON SCHEMA public TO {{ $databaseUser }};
              SQL
          env:
            - name: HOME
              value: /tmp
            - name: PGHOST
              value: {{ include "tali.componentName" (dict "root" . "component" "postgresql") | quote }}
            - name: PGUSER
              value: litellm
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: postgres-password
            - name: HINDSIGHT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: hindsight-database-password
          resources:
            {{- toYaml .Values.hindsight.migration.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: migrate
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.hindsight) }}
          imagePullPolicy: {{ .Values.images.hindsight.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - >-
              hindsight-admin run-db-migration
              --schema "$HINDSIGHT_API_DATABASE_SCHEMA"
              --embedding-dimension "$HINDSIGHT_EMBEDDING_DIMENSIONS"
          env:
            {{- include "tali.hindsightCommonEnv" . | nindent 12 }}
            - name: HINDSIGHT_EMBEDDING_DIMENSIONS
              value: {{ .Values.hindsight.models.embeddingDimensions | quote }}
          resources:
            {{- toYaml .Values.hindsight.migration.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
{{- end }}

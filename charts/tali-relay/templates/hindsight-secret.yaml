{{- if and .Values.hindsight.enabled (not .Values.secrets.existingSecrets.hindsight) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali.secretName" (dict "root" . "component" "hindsight") }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" "hindsight") | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
type: Opaque
stringData:
  hindsight-config.json: |
{{ include "tali.hindsightConfig" . | indent 4 }}
{{- end }}

{{- if and .Values.keycloak.enabled (not .Values.secrets.existingSecrets.keycloak) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali.secretName" (dict "root" . "component" "keycloak") }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" "keycloak") | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
type: Opaque
stringData:
  keycloak-admin-password: {{ required "secrets.keycloakAdminPassword is required" .Values.secrets.keycloakAdminPassword | quote }}
  keycloak-client-secret: {{ required "secrets.keycloakClientSecret is required" .Values.secrets.keycloakClientSecret | quote }}
  keycloak-test-user-password: {{ required "secrets.keycloakTestUserPassword is required" .Values.secrets.keycloakTestUserPassword | quote }}
{{- end }}

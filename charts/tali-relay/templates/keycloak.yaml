{{- if .Values.keycloak.enabled }}
{{- if .Values.secrets.existingSecrets.keycloak }}
{{- fail "keycloak.enabled cannot be combined with secrets.existingSecrets.keycloak because the chart must generate the connected control.toml and Keycloak test credentials" }}
{{- end }}
{{- if not .Values.keycloak.testUsers }}
{{- fail "keycloak.testUsers must contain at least one complete test user when the embedded Keycloak is enabled" }}
{{- end }}
{{- if not .Values.keycloak.testProjectIds }}
{{- fail "keycloak.testProjectIds must contain at least one Project ID when the embedded Keycloak is enabled" }}
{{- end }}
{{- $component := "keycloak" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
{{- $publicUrl := trimSuffix "/" (required "keycloak.publicUrl is required when the embedded Keycloak is enabled" .Values.keycloak.publicUrl) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-realm
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
data:
  tali-realm.json: |
    {
      "realm": "tali",
      "displayName": "TaskLattice Relay Test",
      "enabled": true,
      "registrationAllowed": false,
      "resetPasswordAllowed": true,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "clientScopes": [
        {
          "name": "profile",
          "description": "OpenID Connect profile claims",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "full name",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-full-name-mapper",
              "consentRequired": false,
              "config": {
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "preferred username",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "username",
                "claim.name": "preferred_username",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "email",
          "description": "OpenID Connect email claims",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "true"
          },
          "protocolMappers": [
            {
              "name": "email",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "email",
                "claim.name": "email",
                "jsonType.label": "String",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            },
            {
              "name": "email verified",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-property-mapper",
              "consentRequired": false,
              "config": {
                "user.attribute": "emailVerified",
                "claim.name": "email_verified",
                "jsonType.label": "boolean",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true"
              }
            }
          ]
        },
        {
          "name": "groups",
          "description": "TaskLattice Relay full Group paths",
          "protocol": "openid-connect",
          "attributes": {
            "include.in.token.scope": "true",
            "display.on.consent.screen": "false"
          },
          "protocolMappers": [
            {
              "name": "groups",
              "protocol": "openid-connect",
              "protocolMapper": "oidc-group-membership-mapper",
              "consentRequired": false,
              "config": {
                "full.path": "true",
                "id.token.claim": "true",
                "access.token.claim": "true",
                "userinfo.token.claim": "true",
                "claim.name": "groups",
                "jsonType.label": "String",
                "multivalued": "true"
              }
            }
          ]
        }
      ],
      "clients": [
        {
          "clientId": "tali-control-plane",
          "name": "TaskLattice Relay Control Plane",
          "enabled": true,
          "protocol": "openid-connect",
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "${TALI_KEYCLOAK_CLIENT_SECRET}",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "defaultClientScopes": ["profile", "email"],
          "optionalClientScopes": ["groups"],
          "redirectUris": [
            {{ printf "%s/api/auth/callback/corporate-sso" (trimSuffix "/" .Values.control.publicUrl) | quote }}
          ],
          "webOrigins": [
            {{ trimSuffix "/" .Values.control.publicUrl | quote }}
          ],
          "attributes": {
            "post.logout.redirect.uris": {{ printf "%s/*" (trimSuffix "/" .Values.control.publicUrl) | quote }}
          }
        }
      ],
      "groups": [
        {
          "name": "tali",
          "subGroups": [
            {
              "name": "r",
              "subGroups": [
                { "name": "ROLE_PLATFORM_ADMIN" }
              ]
            },
            {
              "name": "d",
              "subGroups": [
                {
                  "name": "dep1",
                  "subGroups": [
                    {
                      "name": "r",
                      "subGroups": [
                        { "name": "ROLE_DEPARTMENT_ADMIN" },
                        { "name": "ROLE_DEPARTMENT_MEMBER" }
                      ]
                    },
                    {
                      "name": "p",
                      "subGroups": [
                        {{- range $projectIndex, $projectId := .Values.keycloak.testProjectIds }}
                        {{- if $projectIndex }},{{ end }}
                        {
                          "name": {{ required "every keycloak.testProjectIds entry requires a Project ID" $projectId | quote }},
                          "subGroups": [
                            {
                              "name": "r",
                              "subGroups": [
                                { "name": "ROLE_PROJECT_ADMIN" },
                                { "name": "ROLE_AGENT_DEVELOPER" },
                                { "name": "ROLE_AUDITOR" },
                                { "name": "ROLE_REVIEWER" },
                                { "name": "ROLE_USER" }
                              ]
                            }
                          ]
                        }
                        {{- end }}
                      ]
                    }
                  ]
                }
              ]
            }
          ]
        }
      ],
      "users": [
        {{- range $index, $user := .Values.keycloak.testUsers }}
        {{- if $index }},{{ end }}
        {
          {{- with $user.id }}
          "id": {{ . | quote }},
          {{- end }}
          "username": {{ required "every keycloak.testUsers entry requires username" $user.username | quote }},
          "email": {{ required "every keycloak.testUsers entry requires email" $user.email | quote }},
          "firstName": {{ required "every keycloak.testUsers entry requires firstName" $user.firstName | quote }},
          "lastName": {{ required "every keycloak.testUsers entry requires lastName" $user.lastName | quote }},
          "enabled": true,
          "emailVerified": true,
          "groups": {{ toJson ($user.groups | default (list)) }},
          "credentials": [
            {
              "type": "password",
              "value": {{ $user.password | default "${TALI_KEYCLOAK_TEST_USER_PASSWORD}" | quote }},
              "temporary": false
            }
          ]
        }
        {{- end }}
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "platform") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/realm: {{ printf "%s:%s:%d" (toJson .Values.keycloak) .Values.control.publicUrl .Release.Revision | sha256sum }}
        checksum/keycloak-secret: {{ include "tali.keycloakSecretChecksum" . }}
    spec:
      serviceAccountName: {{ include "tali.runtimeServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.keycloak) }}
          imagePullPolicy: {{ .Values.images.keycloak.pullPolicy }}
          args:
            - start-dev
            - --import-realm
            - --hostname={{ $publicUrl }}
            - --health-enabled=true
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: {{ required "keycloak.adminUsername is required when the embedded Keycloak is enabled" .Values.keycloak.adminUsername | quote }}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" (dict "root" . "component" "keycloak") }}
                  key: keycloak-admin-password
            - name: TALI_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" (dict "root" . "component" "keycloak") }}
                  key: keycloak-client-secret
            - name: TALI_KEYCLOAK_TEST_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" (dict "root" . "component" "keycloak") }}
                  key: keycloak-test-user-password
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import/tali-realm.json
              subPath: tali-realm.json
              readOnly: true
      volumes:
        - name: realm
          configMap:
            name: {{ $name }}-realm
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation" "annotations" .Values.keycloak.service.annotations) | nindent 4 }}
spec:
  type: {{ .Values.keycloak.service.type }}
  {{- with .Values.keycloak.service.loadBalancerIP }}
  loadBalancerIP: {{ . | quote }}
  {{- end }}
  selector:
    {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.keycloak.service.port }}
      targetPort: http
{{- end }}

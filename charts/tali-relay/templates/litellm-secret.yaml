{{- if not .Values.secrets.existingSecrets.litellm }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali.secretName" (dict "root" . "component" "litellm") }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" "litellm") | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
type: Opaque
stringData:
  litellm-config.yaml: |
    {}
  database-url: {{ include "tali.databaseUrl" . | quote }}
  litellm-master-key: {{ required "secrets.litellmMasterKey is required" .Values.secrets.litellmMasterKey | quote }}
  litellm-ui-username: {{ .Values.secrets.litellmUiUsername | quote }}
  litellm-ui-password: {{ .Values.secrets.litellmUiPassword | quote }}
  litellm-salt-key: {{ .Values.secrets.litellmSaltKey | quote }}
{{- end }}

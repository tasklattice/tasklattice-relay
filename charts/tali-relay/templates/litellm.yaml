{{- $component := "litellm" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "platform") | nindent 4 }}
spec:
  replicas: {{ .Values.litellm.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/litellm-secret: {{ include "tali.litellmSecretChecksum" . }}
        {{- if .Values.litellm.caCertificate }}
        checksum/litellm-ca: {{ .Values.litellm.caCertificate | sha256sum }}
        {{- end }}
        {{- with .Values.global.rolloutRevision }}
        tali.ai/rollout-revision: {{ . | quote }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "tali.runtimeServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgresql
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.postgres) }}
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          command: ["sh", "-ec"]
          args:
            - >-
              until pg_isready
              --host {{ include "tali.componentName" (dict "root" . "component" "postgresql") }}
              --port 5432
              --username litellm
              --dbname litellm;
              do sleep 2; done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: litellm
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.litellm) }}
          imagePullPolicy: {{ .Values.images.litellm.pullPolicy }}
          args: ["--config", "/etc/litellm/config.yaml", "--port", "4000", "--num_workers", {{ .Values.litellm.workers | quote }}, "--use_v2_migration_resolver"]
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: LITELLM_MIGRATION_DIR
              value: /tmp/litellm-migrations
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: {{ ternary "True" "False" .Values.litellm.localModelCostMap | quote }}
            - name: MAXIMUM_TRACEBACK_LINES_TO_LOG
              value: {{ .Values.litellm.maximumTracebackLinesToLog | quote }}
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: litellm-master-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: database-url
            - name: UI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: litellm-ui-username
            - name: UI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: litellm-ui-password
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: litellm-salt-key
            - name: DOCS_URL
              value: /docs
            - name: ROOT_REDIRECT_URL
              value: /ui
            {{- with .Values.litellm.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: litellm-config
              mountPath: /etc/litellm/config.yaml
              subPath: config.yaml
              readOnly: true
            {{- if .Values.litellm.caCertificate }}
            - name: litellm-ca
              mountPath: /etc/ssl/certs
              readOnly: true
            {{- end }}
          startupProbe:
            httpGet:
              path: /health/liveliness
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.litellm.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: litellm-config
          secret:
            secretName: {{ include "tali.secretName" . }}
            items:
              - key: litellm-config.yaml
                path: config.yaml
        {{- if .Values.litellm.caCertificate }}
        - name: litellm-ca
          secret:
            secretName: {{ include "tali.componentName" (dict "root" . "component" "litellm-ca") }}
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.labels" . | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation" "annotations" .Values.litellm.service.annotations) | nindent 4 }}
spec:
  type: {{ .Values.litellm.service.type }}
  selector:
    {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.litellm.service.port }}
      targetPort: http

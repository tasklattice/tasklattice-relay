{{- if not .Values.secrets.existingSecrets.metrics }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali.secretName" (dict "root" . "component" "metrics") }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" "metrics") | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
type: Opaque
stringData:
  metrics-token: {{ required "secrets.metricsToken is required" .Values.secrets.metricsToken | quote }}
{{- end }}

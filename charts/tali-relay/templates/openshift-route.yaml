{{- if and .Values.openshift.enabled .Values.openshift.routes.control.enabled }}
{{- $route := .Values.openshift.routes.control }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "tali.componentName" (dict "root" . "component" "control") }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" "control") | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "exposure" "annotations" $route.annotations) | nindent 4 }}
spec:
  {{- with $route.host }}
  host: {{ . | quote }}
  {{- end }}
  port:
    targetPort: http
  to:
    kind: Service
    name: {{ include "tali.componentName" (dict "root" . "component" "control") }}
    weight: 100
  {{- if $route.tls.enabled }}
  tls:
    termination: {{ $route.tls.termination }}
    insecureEdgeTerminationPolicy: {{ $route.tls.insecureEdgeTerminationPolicy }}
  {{- end }}
  wildcardPolicy: None
{{- end }}

{{- if not .Values.secrets.existingSecrets.postgresql }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali.secretName" (dict "root" . "component" "postgresql") }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" "postgresql") | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "secrets.postgresPassword is required" .Values.secrets.postgresPassword | quote }}
  admin-url: {{ printf "postgresql://litellm:%s@%s:5432/postgres" (urlquery .Values.secrets.postgresPassword | replace "+" "%20") (include "tali.componentName" (dict "root" . "component" "postgresql")) | quote }}
{{- end }}

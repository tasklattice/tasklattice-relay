{{- $component := "postgresql" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.labels" . | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "database") | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/postgresql-secret: {{ include "tali.postgresqlSecretChecksum" . }}
    spec:
      serviceAccountName: {{ include "tali.runtimeServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.postgres) }}
          imagePullPolicy: {{ .Values.images.postgres.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: litellm
            - name: POSTGRES_USER
              value: litellm
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" (dict "root" . "component" "postgresql") }}
                  key: postgres-password
          readinessProbe:
            exec:
              command: ["pg_isready", "--username", "litellm", "--dbname", "litellm"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "--username", "litellm", "--dbname", "litellm"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.persistence.size }}

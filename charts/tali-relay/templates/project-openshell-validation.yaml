{{/* Removed public knobs: fail explicitly instead of silently ignoring old values. */}}
{{- $removed := dict
  "secrets" "component Secrets are generated from one credentialBootstrap store"
  "global.argocd" "Argo CD sync order is built into the Chart"
  "projectOpenShell.releaseName" "the Project release name is fixed to openshell"
  "projectOpenShell.serviceNamePrefix" "the Project Gateway prefix is fixed to openshell-"
  "projectOpenShell.helmChart" "Worker uses the bundled /opt/tali/helm/openshell.tgz"
  "keycloak.testUsers" "the test provider uses bundled identities"
  "keycloak.testProjectIds" "the test provider uses bundled Project aliases"
  "openshift.routes.keycloak" "configure an external OIDC provider from Platform Settings for OpenShift SSO"
  "control.worker.enabled" "Control Worker is always enabled"
  "projectOpenShell.enabled" "Project Gateways are always enabled"
  "runner.projectTargetRouting.enabled" "Project routing is always enabled"
  "projectRuntimeNamespaces.enabled" "Project Namespaces are always enabled"
  "projectRuntimeNamespaces.resourceOwnership" "Project resource ownership is always enabled"
  "openshell.enabled" "OpenShell is installed only in Project Namespaces"
  "openshell.server.disableTls" "tenant TLS/auth are fixed by the supported internal topology"
  "openshell.server.auth.allowUnauthenticatedUsers" "tenant TLS/auth are fixed by the supported internal topology"
  "openshell.service.type" "Project Gateway Services always use ClusterIP"
  "openshell.supervisor.sideloadMethod" "Supervisor sideloading always uses init-container"
  "openshell.server.telemetryEnabled" "Gateway telemetry is always disabled"
  "openshell.server.workspaceDefaultStorageSize" "use projectOpenShell.workspace.storageSize"
  "openshell.server.workspaceStorageClass" "use projectOpenShell.workspace.storageClass"
  "runner.serviceBaseUrl" "the internal OpenShell Host base is managed automatically; browsers use control.publicUrls"
  "runner.projectTargetRouting.gatewayEndpointTemplate" "Project Gateway endpoints use the fixed openshell- prefix"
-}}
{{- range $path, $reason := $removed -}}
{{- $value := $.Values -}}
{{- $present := true -}}
{{- range splitList "." $path -}}
{{- if kindIs "map" $value -}}
{{- if hasKey $value . -}}
{{- $value = index $value . -}}
{{- else -}}
{{- $present = false -}}
{{- $value = dict -}}
{{- end -}}
{{- else -}}
{{- $present = false -}}
{{- end -}}
{{- end -}}
{{- if $present -}}
{{- fail (printf "%s was removed; %s. Remove this key from your Helm values" $path $reason) -}}
{{- end -}}
{{- end -}}
{{- if or (hasKey .Values.control "extraEnv") (hasKey .Values.control.worker "extraEnv") -}}
{{- fail "control.extraEnv and control.worker.extraEnv were removed; use the supported control and control.worker values" -}}
{{- end -}}
{{- if hasKey .Values.exampleMcp.auth "password" -}}
{{- fail "Inline example MCP credentials were removed; credentials come from the credentialBootstrap store" -}}
{{- end -}}
{{- if hasKey .Values.runner "extraEnv" -}}
{{- fail "runner.extraEnv was removed; use the supported runner values" -}}
{{- end -}}
{{/* The OpenShift profile ships no identity provider: OCP SSO uses an external
     provider registered in Platform Settings. Reject the combination instead of
     deploying a test provider the profile does not support. */}}
{{- if and .Values.openshift.enabled .Values.keycloak.enabled -}}
{{- fail "keycloak.enabled must stay false with openshift.enabled; configure an external OIDC provider from Platform Settings for OpenShift SSO" -}}
{{- end -}}
{{/* The embedded provider is a development-only test IdP. Production profiles
     register an external OIDC provider from Platform Settings instead. */}}
{{- if and .Values.keycloak.enabled (not .Values.developmentProfile.enabled) -}}
{{- fail "keycloak.enabled requires developmentProfile.enabled; the embedded Keycloak is available only in the development profile, and released installations configure an external OIDC provider from Platform Settings" -}}
{{- end -}}
{{- if eq (include "tali.runtimeImagesEnabled" .) "true" -}}
{{/* Two unrelated upstream images must not silently collapse onto the same tag.
     Identical digest references can safely share content across repositories. */}}
{{- $references := list
  (printf "%s:%s" .Values.openshell.image.repository .Values.openshell.image.tag)
  (printf "%s:%s" .Values.openshell.supervisor.image.repository .Values.openshell.supervisor.image.tag)
  .Values.openshell.server.sandboxImage
  (include "tali.image" (dict "root" . "image" .Values.images.openclawSandbox))
  (include "tali.image" (dict "root" . "image" .Values.images.hermesSandbox))
  (include "tali.image" (dict "root" . "image" .Values.images.deepagentsSandbox))
  (include "tali.image" (dict "root" . "image" .Values.images.piSandbox))
  (include "tali.image" (dict "root" . "image" .Values.images.control))
  (include "tali.image" (dict "root" . "image" .Values.images.expertAgentRuntime))
  (include "tali.image" (dict "root" . "image" .Values.images.exampleMcp)) -}}
{{- $sources := dict -}}
{{- range $reference := $references -}}
{{- $resolved := include "tali.runtimeImageReference" (dict "root" $ "reference" $reference) -}}
{{- if not (contains "@" $resolved) -}}
{{- if not (contains ":" (last (splitList "/" $resolved))) -}}{{- $resolved = printf "%s:latest" $resolved -}}{{- end -}}
{{- $original := $reference -}}
{{- if not (contains ":" (last (splitList "/" $original))) -}}{{- $original = printf "%s:latest" $original -}}{{- end -}}
{{- if and (hasKey $sources $resolved) (ne (index $sources $resolved) $original) -}}
{{- fail (printf "Tenant image mapping collision: %s and %s resolve to %s; use distinct mirrored repository names" (index $sources $resolved) $original $resolved) -}}
{{- end -}}
{{- $_ := set $sources $resolved $original -}}
{{- end -}}
{{- end -}}
{{- end -}}

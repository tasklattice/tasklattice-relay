{{- $component := "project-runtime-control" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
{{- $clusterScopeId := printf "%s/%s" .Release.Namespace $name -}}
{{- $clusterRoleName := printf "%s-%s" ($name | trunc 48 | trimSuffix "-") ($clusterScopeId | sha256sum | trunc 12) -}}
{{- $workerComponent := "control-worker" -}}
{{- $workerName := include "tali.componentName" (dict "root" . "component" $workerComponent) -}}
{{- $workerClusterScopeId := printf "%s/%s" .Release.Namespace $workerName -}}
{{- $workerClusterRoleName := printf "%s-%s" ($workerName | trunc 48 | trimSuffix "-") ($workerClusterScopeId | sha256sum | trunc 12) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
rules:
  # API reads runtime diagnostics; only Worker may mutate runtime resources.
  - apiGroups: [""]
    resources: ["namespaces", "services", "pods", "pods/log"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps", "serviceaccounts"]
    verbs: ["get"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings", "clusterroles", "clusterrolebindings"]
    verbs: ["get"]
  # Read the upstream OpenShell Sandbox SSH policy for Project diagnostics.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get"]
  # Secret reads are granted inside each owned Project Namespace by Worker.
  # No access to Control/Worker configuration Secrets is granted here.

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tali.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterRoleName }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tali.controlWorkerServiceAccountName" . }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $workerComponent) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $workerClusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $workerComponent) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "create", "patch"]
  {{- if .Values.openshift.enabled }}
  {{- if eq (include "tali.manageTenantScc" .) "true" }}
  # Tenant namespaces are dynamic. Worker can bind only these two SCC roles;
  # it is not itself granted use of privileged SCC or arbitrary bind/escalate.
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: ["system:openshift:scc:privileged", "system:openshift:scc:anyuid"]
    verbs: ["bind"]
  {{- end }}
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  {{- end }}
  {{- include "tali.projectOpenShellControllerRules" . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $workerClusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $workerComponent) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tali.controlWorkerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $workerClusterRoleName }}

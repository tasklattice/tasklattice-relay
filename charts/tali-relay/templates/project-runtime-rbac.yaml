{{- $component := "project-runtime-control" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
{{- $clusterScopeId := printf "%s/%s" .Release.Namespace $name -}}
{{- $clusterRoleName := printf "%s-%s" ($name | trunc 48 | trimSuffix "-") ($clusterScopeId | sha256sum | trunc 12) -}}
{{- $workerComponent := "control-worker" -}}
{{- $workerName := include "tali.componentName" (dict "root" . "component" $workerComponent) -}}
{{- $workerClusterScopeId := printf "%s/%s" .Release.Namespace $workerName -}}
{{- $workerClusterRoleName := printf "%s-%s" ($workerName | trunc 48 | trimSuffix "-") ($workerClusterScopeId | sha256sum | trunc 12) -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch", "delete"]
  {{- if .Values.projectOpenShell.enabled }}
  {{- include "tali.projectOpenShellControllerRules" . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tali.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterRoleName }}
{{- if .Values.control.worker.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tali.controlWorkerServiceAccountName" . }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $workerComponent) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $workerClusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $workerComponent) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "patch", "delete"]
  {{- if and .Values.projectRuntimeNamespaces.enabled .Values.expertAgentRuntime.enabled }}
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "create", "patch", "delete"]
  {{- end }}
  {{- if .Values.projectOpenShell.enabled }}
  {{- include "tali.projectOpenShellControllerRules" . | nindent 2 }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $workerClusterRoleName }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $workerComponent) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tali.controlWorkerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $workerClusterRoleName }}
{{- end }}

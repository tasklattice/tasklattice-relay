apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tali.componentName" (dict "root" . "component" "runner") }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" "runner") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tali.selectorLabels" (dict "root" . "component" "runner") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [control, control-worker]
      ports:
        - protocol: TCP
          port: 9090

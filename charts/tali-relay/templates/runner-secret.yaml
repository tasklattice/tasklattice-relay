{{- if not .Values.secrets.existingSecrets.runner }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tali.secretName" (dict "root" . "component" "runner") }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" "runner") | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
type: Opaque
stringData:
  runner.json: |
{{ include "tali.runnerConfig" . | indent 4 }}
{{- end }}

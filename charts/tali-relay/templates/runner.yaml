{{- $component := "runner" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "application") | nindent 4 }}
spec:
  replicas: {{ .Values.runner.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/runner-secret: {{ include "tali.runnerSecretChecksum" . }}
        {{- with .Values.global.rolloutRevision }}
        tali.ai/rollout-revision: {{ . | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 600
      serviceAccountName: {{ include "tali.runtimeServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.runner) }}
          imagePullPolicy: {{ .Values.images.runner.pullPolicy }}
          ports:
            - name: http
              containerPort: 9090
            {{- if and .Values.runner.projectTargetRouting.enabled .Values.runner.projectTargetRouting.serviceProxy.enabled }}
            - name: service-proxy
              containerPort: {{ .Values.runner.projectTargetRouting.serviceProxy.port }}
            {{- end }}
          env:
            - name: TALI_RUNNER_CONFIG
              value: /etc/tali-runner/runner.json
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runner-config
              mountPath: /etc/tali-runner
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/node
      volumes:
        - name: runner-config
          secret:
            secretName: {{ include "tali.secretName" (dict "root" . "component" "runner") }}
            items:
              - key: runner.json
                path: runner.json
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: home
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.labels" . | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
spec:
  selector:
    {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- if and .Values.runner.projectTargetRouting.enabled .Values.runner.projectTargetRouting.serviceProxy.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-openshell-services" $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "tali.labels" . | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "exposure" "annotations" .Values.runner.projectTargetRouting.serviceProxy.annotations) | nindent 4 }}
spec:
  type: {{ .Values.runner.projectTargetRouting.serviceProxy.type }}
  selector:
    {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.runner.projectTargetRouting.serviceProxy.port }}
      targetPort: service-proxy
{{- end }}

{{- $component := "runner" -}}
{{- $name := include "tali.componentName" (dict "root" . "component" $component) -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.componentLabels" (dict "root" . "component" $component) | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "application") | nindent 4 }}
spec:
  replicas: {{ .Values.runner.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        checksum/runner-secret: {{ include "tali.runnerSecretChecksum" . }}
        {{- with .Values.global.rolloutRevision }}
        tali.ai/rollout-revision: {{ . | quote }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 600
      serviceAccountName: {{ include "tali.runtimeServiceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: runner
          image: {{ include "tali.image" (dict "root" . "image" .Values.images.runner) }}
          imagePullPolicy: {{ .Values.images.runner.pullPolicy }}
          ports:
            - name: http
              containerPort: 9090
            {{- if and .Values.runner.projectTargetRouting.enabled .Values.runner.projectTargetRouting.serviceProxy.enabled }}
            - name: service-proxy
              containerPort: {{ .Values.runner.projectTargetRouting.serviceProxy.port }}
            {{- end }}
          env:
            - name: NEMOCLAW_RUNNER_MODE
              value: openshell-kubernetes
            - name: NEMOCLAW_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "tali.secretName" . }}
                  key: runner-token
            - name: OPENSHELL_GATEWAY_IMAGE
              value: {{ printf "%s:%s" .Values.openshell.image.repository .Values.openshell.image.tag | quote }}
            - name: OPENSHELL_SUPERVISOR_IMAGE
              value: {{ printf "%s:%s" .Values.openshell.supervisor.image.repository .Values.openshell.supervisor.image.tag | quote }}
            - name: OPENSHELL_DEFAULT_SANDBOX_IMAGE
              value: {{ .Values.openshell.server.sandboxImage | quote }}
            - name: OPENSHELL_DEFAULT_SANDBOX_IMAGE_PULL_POLICY
              value: {{ .Values.openshell.server.sandboxImagePullPolicy | quote }}
            - name: OPENSHELL_TLS_DISABLED
              value: {{ .Values.openshell.server.disableTls | quote }}
            - name: OPENSHELL_PROJECT_TARGET_ROUTING
              value: {{ .Values.runner.projectTargetRouting.enabled | quote }}
            - name: OPENSHELL_GATEWAY_ENDPOINT_TEMPLATE
              value: {{ .Values.runner.projectTargetRouting.gatewayEndpointTemplate | quote }}
            - name: OPENSHELL_PROJECT_GATEWAY_SERVICE_NAME_PREFIX
              value: {{ .Values.projectOpenShell.serviceNamePrefix | quote }}
            - name: OPENSHELL_PROJECT_SERVICE_PROXY_ENABLED
              value: {{ and .Values.runner.projectTargetRouting.enabled .Values.runner.projectTargetRouting.serviceProxy.enabled | quote }}
            - name: OPENSHELL_SERVICE_PROXY_PORT
              value: {{ .Values.runner.projectTargetRouting.serviceProxy.port | quote }}
            - name: NEMOCLAW_VERSION
              value: {{ .Values.projectOpenShell.nemoclawVersion | quote }}
            - name: OPENSHELL_SERVICE_BASE_URL
              value: {{ .Values.runner.serviceBaseUrl | quote }}
            - name: OPENSHELL_SANDBOX_IMAGE
              value: {{ include "tali.image" (dict "root" . "image" .Values.images.openclawSandbox) | quote }}
            - name: OPENSHELL_HERMES_SANDBOX_IMAGE
              value: {{ include "tali.image" (dict "root" . "image" .Values.images.hermesSandbox) | quote }}
            - name: OPENSHELL_DEEPAGENTS_SANDBOX_IMAGE
              value: {{ include "tali.image" (dict "root" . "image" .Values.images.deepagentsSandbox) | quote }}
            - name: OPENSHELL_KUBERNETES_SERVICE_CIDRS
              value: {{ .Values.runner.kubernetesServiceCidrs | quote }}
            - name: OPENSHELL_SANDBOX_CPU
              value: {{ .Values.runner.sandbox.cpu | quote }}
            {{- with .Values.runner.sandbox.cpuRequest }}
            - name: OPENSHELL_SANDBOX_CPU_REQUEST
              value: {{ . | quote }}
            {{- end }}
            - name: OPENSHELL_SANDBOX_MEMORY
              value: {{ .Values.runner.sandbox.memory | quote }}
            - name: NEMOCLAW_RUNNER_SHUTDOWN_TIMEOUT_MS
              value: "540000"
            {{- with .Values.runner.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.runner.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: home
              mountPath: /home/node
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: home
          emptyDir:
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "tali.labels" . | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "foundation") | nindent 4 }}
spec:
  selector:
    {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: 9090
      targetPort: http
{{- if and .Values.runner.projectTargetRouting.enabled .Values.runner.projectTargetRouting.serviceProxy.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-openshell-services" $name | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "tali.labels" . | nindent 4 }}
  annotations:
    {{- include "tali.resourceAnnotations" (dict "root" . "wave" "exposure" "annotations" .Values.runner.projectTargetRouting.serviceProxy.annotations) | nindent 4 }}
spec:
  type: {{ .Values.runner.projectTargetRouting.serviceProxy.type }}
  selector:
    {{- include "tali.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.runner.projectTargetRouting.serviceProxy.port }}
      targetPort: service-proxy
{{- end }}

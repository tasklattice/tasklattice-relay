# Example disconnected-registry overrides. Replace registry.airgap.example.com
# and the Secret name with values from the target environment. Use this file
# together with values-openshift.yaml for OpenShift.
# This profile pulls directly from an external disconnected registry. To reuse
# imported OCP ImageStreams instead, enable this and configure imageSourceNamespace
# / imageRegistryHost after importing every tenant image into that source.
openshift:
  runtimeImages:
    enabled: false

global:
  imageRegistry: registry.airgap.example.com/tali
  imagePullSecrets:
    - name: airgap-registry

# Keep disconnected behavior explicit even if the general chart defaults
# change in a future release.
litellm:
  workers: 1
  localModelCostMap: true

# Images implemented by TaskLattice Relay inherit global.imageRegistry. External
# runtime images use full repository paths so they can be mirrored separately.
images:
  postgres:
    repository: registry.airgap.example.com/third-party/pgvector
    tag: 0.8.6-pg17
    useGlobalRegistry: false
  keycloak:
    repository: registry.airgap.example.com/third-party/keycloak
    tag: 26.7.0
    useGlobalRegistry: false
  docling:
    repository: registry.airgap.example.com/third-party/docling-serve-cpu
    tag: v1.29.0
    useGlobalRegistry: false
  hindsight:
    repository: registry.airgap.example.com/third-party/hindsight-api
    tag: 1.1.0-slim@sha256:b97af4787f35f0f897cc85299e1c800e265ff98e1d70c900c58a7f9903cb5b7d
    useGlobalRegistry: false

agentSandbox:
  image:
    repository: registry.airgap.example.com/third-party/agent-sandbox-controller
    tag: v1.0.2
  imagePullSecrets:
    - name: airgap-registry

openshell:
  image:
    repository: registry.airgap.example.com/third-party/openshell-gateway
    tag: 0.0.116
  imagePullSecrets:
    - name: airgap-registry
  supervisor:
    image:
      repository: registry.airgap.example.com/third-party/openshell-supervisor
      tag: 0.0.116
  server:
    sandboxImage: registry.airgap.example.com/third-party/nemoclaw-sandbox-base:v0.0.138
    sandboxImagePullSecrets:
      - name: airgap-registry

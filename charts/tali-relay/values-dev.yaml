# Local development uses the same canonical image names as a release. Images
# are built into the local Docker store with the mutable :dev tag and are never
# published by the release workflow.
global:
  imageRegistry: ghcr.io/tasklattice

images:
  control:
    tag: dev
    pullPolicy: IfNotPresent
  runner:
    tag: dev
    pullPolicy: IfNotPresent
  expertAgentRuntime:
    tag: dev
    pullPolicy: IfNotPresent
  litellm:
    tag: dev
    pullPolicy: IfNotPresent
  exampleMcp:
    tag: dev
    pullPolicy: IfNotPresent
  openclawSandbox:
    tag: dev
  hermesSandbox:
    tag: dev
  deepagentsSandbox:
    tag: dev

# Match the existing trusted local-cluster developer experience.
control:
  service:
    type: LoadBalancer
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Local Vector Database acceptance depends on the bundled parser. Keep this
# explicit so a source-Chart deployment cannot silently omit Docling when chart
# defaults evolve.
docling:
  enabled: true

litellm:
  service:
    type: LoadBalancer

openshell:
  # OpenShell 0.0.106 has one fixed sandbox Namespace per Gateway. Local
  # development exercises the Project-isolated compatibility topology.
  enabled: false
  # Keep the two Project Gateways and their certificate hooks schedulable on
  # the constrained single-node development cluster. Production defaults stay
  # at 100m/128Mi in values.yaml.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  service:
    type: LoadBalancer
  server:
    sandboxImagePullPolicy: IfNotPresent

projectOpenShell:
  enabled: true

runner:
  # Keep the local Project-isolation acceptance Sandbox schedulable alongside
  # the control stack and any developer Sandboxes already on a single node.
  sandbox:
    cpu: "1"
    cpuRequest: 500m
  extraEnv:
    - name: NEMOCLAW_START_TIMEOUT_MS
      value: "600000"
  projectTargetRouting:
    enabled: true

keycloak:
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

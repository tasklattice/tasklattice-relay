# OpenShift profile for clusters where the administrator permits anyuid.
#
# This profile configures the Control namespace and enables Worker's automatic
# per-Project SCC bindings before Gateway hooks and runtime Pods start.
openshift:
  enabled: true
  # Tenant Gateway/certgen, Supervisor, default/platform Sandboxes, runtime bridge
  # and expert runtime share ImageStreams in this release namespace by default.
  # Import their existing image names/tags first; see the chart README.
  runtimeImages:
    enabled: true
  anyuidScc:
    createRoleBinding: true
  routes:
    control:
      enabled: true

control:
  # Required: set the browser origin served by the Control Route.
  publicUrls: []
  # The managed Route overwrites forwarded headers at TLS termination.
  trustProxyHeaders: true
  service:
    type: ClusterIP

# No identity provider is deployed on OpenShift. SSO uses an external OIDC
# provider configured from Platform Settings; an embedded test Keycloak is not
# rendered with this profile.
keycloak:
  enabled: false

agentSandbox:
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

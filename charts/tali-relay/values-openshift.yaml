# OpenShift profile for clusters where the administrator permits anyuid.
#
# This profile configures the Control namespace. Business OpenShell SCC grants
# are managed separately by the platform in each Project Namespace.
openshift:
  enabled: true
  # Tenant Gateway/certgen, Supervisor, default/platform Sandboxes, runtime bridge
  # and expert runtime share ImageStreams in this release namespace by default.
  # Import their existing image names/tags first; see the chart README.
  runtimeImages:
    enabled: true
  anyuidScc:
    createRoleBinding: true
  routes:
    control:
      enabled: true

control:
  service:
    type: ClusterIP

keycloak:
  service:
    type: ClusterIP

runner:
  projectTargetRouting:
    serviceProxy:
      type: ClusterIP

agentSandbox:
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

serviceAccount:
  create: true
  name: ""
  annotations: {}
  runtime:
    create: true
    name: ""
    annotations: {}

nameOverride: ""
fullnameOverride: ""

# Default CPU and memory values for containers created by runtime dependencies
# that do not expose per-container resource settings (for example, OpenShell's
# dynamically injected sandbox init containers). Disable this only when the
# target namespace already has an equivalent platform-managed LimitRange.
resourceDefaults:
  enabled: true
  defaultRequest:
    cpu: 10m
    memory: 32Mi
  default:
    cpu: 500m
    memory: 512Mi

# Selected kubernetes-sigs/agent-sandbox v0.5.1 dependency. Its upstream Chart is
# fetched and packaged by scripts/prepare-helm-dependencies.sh; upstream source
# is not copied into this repository.
agentSandbox:
  enabled: true
  imagePullSecrets: []
  namespace:
    # Run the controller and webhook beside the rest of this Helm release.
    create: false
    name: ""
  image:
    repository: registry.k8s.io/agent-sandbox/agent-sandbox-controller
    tag: v0.5.1
    pullPolicy: IfNotPresent
  controller:
    leaderElect: true
    extensions: false
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Selected upstream OpenShell OCI chart. Plaintext/unauthenticated mode matches
# TaskLattice Relay's current trusted-cluster integration. Put the services behind an
# authenticated ingress or configure OpenShell TLS/OIDC for shared clusters.
openshell:
  enabled: true
  imagePullSecrets: []
  image:
    repository: ghcr.io/nvidia/openshell/gateway
    tag: 0.0.106
    pullPolicy: IfNotPresent
  supervisor:
    image:
      repository: ghcr.io/nvidia/openshell/supervisor
      tag: 0.0.106
      pullPolicy: IfNotPresent
    sideloadMethod: init-container
  service:
    type: LoadBalancer
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
  server:
    # NemoClaw v0.0.114 declares OpenShell 0.0.106 as its supported runtime.
    # Use the matching versioned NemoClaw base instead of a moving :latest tag.
    sandboxImage: ghcr.io/nvidia/nemoclaw/sandbox-base:v0.0.114
    sandboxImagePullPolicy: IfNotPresent
    sandboxImagePullSecrets: []
    telemetryEnabled: false
    disableTls: true
    auth:
      allowUnauthenticatedUsers: true
    workspaceDefaultStorageSize: 1Gi
    workspaceStorageClass: ""
